<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 86" width="1000" height="86" role="img" aria-label="my lab rules"><defs><style>@font-face{font-family:'Bricolage Grotesque';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Caveat';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
