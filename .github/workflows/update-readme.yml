name: Update README Stats 

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 00:00 UTC (adjust based on your timezone, e.g., +06 is 06:00)
  workflow_dispatch: # Allows manual triggering

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update README with stats and eyes animation
        run: |
          echo "Updating README stats and eyes animation..."
          # Insert today's date as a placeholder or update stats using an API
          date > update.txt
          
          # Update the README file with stats and animation
          echo "<!-- PROFILE README for Emtiaz-10 -->" > README.md
          echo "<p align=\"center\">" >> README.md
          echo "  <img src=\"https://github-readme-stats.vercel.app/api?username=Emtiaz-10&show_icons=true&theme=radical&hide_border=true&cache_seconds=1800\" alt=\"Emtiaz-10's GitHub stats\" height=\"160\" />" >> README.md
          echo "</p>" >> README.md
          
          # Add your profile intro, current focus, and GitHub stats with images
          echo "# Hi — I'm Emtiaz 👋" >> README.md
          echo "**AI & ML Enthusiast • Python Developer • Student Tutor • Builder in Progress**" >> README.md
          echo "---" >> README.md
          
          # Focus section
          echo "## 🔭 Current Focus" >> README.md
          echo "- Completing Harvard's CS50 Python course." >> README.md
          echo "- Studying Supervised Machine Learning with Andrew Ng (Coursera)." >> README.md
          echo "- Deepening knowledge in Statistics & Probability." >> README.md
          echo "- Tutoring students in Math, Physics, and Chemistry." >> README.md
          echo "---" >> README.md
          
          # GitHub stats with languages
          echo "## 📈 GitHub Stats" >> README.md
          echo "<p align=\"center\">" >> README.md
          echo "  <img src=\"https://github-readme-stats.vercel.app/api?username=Emtiaz-10&show_icons=true&theme=radical&hide_border=true&cache_seconds=1800\" alt=\"Emtiaz-10's GitHub stats\" height=\"160\" />" >> README.md
          echo "  <img src=\"https://github-readme-stats.vercel.app/api/top-langs/?username=Emtiaz-10&layout=compact&theme=radical&hide_border=true&cache_seconds=1800&langs_count=6\" alt=\"Top Languages\" height=\"160\" />" >> README.md
          echo "</p>" >> README.md
          echo "---" >> README.md

          # Tech and tools section
          echo "## 🛠️ Tech & Tools" >> README.md
          echo "<p align=\"left\">" >> README.md
          echo "  <img src=\"https://skillicons.dev/icons?i=python,git,vscode,jupyter,html,css\" alt=\"Tech Stack\" />" >> README.md
          echo "</p>" >> README.md
          echo "---" >> README.md
          
          # Roadmap section
          echo "## 🧭 Roadmap (Next 90 Days)" >> README.md
          echo "- Complete Harvard CS50 Python exercises." >> README.md
          echo "- Finish first Andrew Ng ML assignment." >> README.md
          echo "- Maintain daily GitHub commits for consistency." >> README.md
          echo "- Update this README to reflect skill growth." >> README.md
          echo "---" >> README.md
          
          # Add the glowing eyes animation
          echo "## Glowing Eyes Animation" >> README.md
          echo "<p align=\"center\">" >> README.md
          echo "  <img src=\"https://i.imgur.com/4Z8gZ3G.gif\" alt=\"Glowing Eyes Animation\" width=\"100\" />" >> README.md
          echo "</p>" >> README.md
          echo "---" >> README.md
          
          # Final note section
          echo "### Final Note" >> README.md
          echo "This README is a living reflection of my journey. I’ll keep it updated as I grow, one commit at a time. 🚀" >> README.md

          # Commit and push changes
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "Automated README stats update with glowing eyes animation [$(date)]" || echo "No changes to commit"
          git push

      - name: Notify on failure
        if: failure()
        run: |
          echo "README update failed. Check the workflow logs."
